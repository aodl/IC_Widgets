<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-dns-prefetch-control" content="off">
  <title>Proposal review | Network Nexus</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" type="module"></script>
</head>
<body>
  <header class="masthead">
    <div class="container masthead-row">
      <strong>Network Nexus</strong>
      <button type="button" id="open-performance">Performance</button>
    </div>
  </header>
  <main class="container">
    <p id="local-notice" class="local-note" hidden>Local replica · fixture data</p>
    <section class="search-shell" aria-label="Review a proposal">
      <form id="search">
        <label>Proposal ID <input name="first" inputmode="numeric" pattern="[0-9]+" maxlength="20" required></label>
        <button class="primary">Review</button>
        <button type="button" id="stop-review" hidden>Stop</button>
        <details id="review-options">
          <summary>Review options</summary>
          <div class="controls">
            <label>Second proposal ID <input name="second" inputmode="numeric" pattern="[0-9]+" maxlength="20"></label>
          </div>
        </details>
      </form>
      <p id="search-error" class="error status" role="alert"></p>
      <div class="status-row">
        <p id="report-status" class="status" role="status"></p>
        <p id="review-elapsed" class="muted" aria-hidden="true"></p>
      </div>
      <div id="review-progress" class="review-progress" hidden>
        <progress aria-label="Current review phase"></progress>
        <span id="review-counts"></span>
      </div>
    </section>
    <div id="report"></div>
    <section class="performance" id="performance" aria-labelledby="performance-heading" hidden>
      <h2 tabindex="-1" id="performance-heading">Node performance</h2>
      <p>Blockmaking counter coverage describes the observed samples. Uptime and health remain unverified.</p>
      <form id="performance-form">
        <label>Performance scope <select id="performance-mode"><option value="independent">Independent subnet</option><option value="follow">Follow membership review</option></select></label>
        <label id="performance-presets" hidden>Node filter <select id="performance-preset">
          <option value="selected">Selected-state members</option><option value="incoming">Incoming</option>
          <option value="outgoing">Outgoing</option><option value="affected">All affected nodes, including intermediate steps</option>
        </select></label>
        <label>Subnet principal <input name="subnet" required></label>
        <label>Lookback days <input name="days" type="number" min="1" max="60" value="7" required></label>
        <button class="primary">Read blockmaking samples</button>
      </form>
      <p id="performance-context" class="muted">Independent subnet scope.</p>
      <p id="performance-status" class="status" role="status"></p>
      <div id="performance-result"></div>
    </section>
  </main>
</body>
</html>
